<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game — Essie Anawalt</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/game.css" />
    <script src="js/main.js" defer></script>
    <script src="js/game.js" defer></script>
  </head>
  <body>
    <header></header>

    <div class="page-layout">
      <main>
        <div class="game-header">
          <div>
            <h1>Memory Match</h1>
            <div id="status">
              <span>Wins: <strong id="win-count">0</strong></span>
              <span>Moves: <strong id="move-count">0</strong></span>
            </div>
          </div>
          <button id="btn-new-game" class="btn">New Game</button>
        </div>
        <section id="game-board"></section>
      </main>

      <aside></aside>
    </div>

    <footer></footer>
  </body>
</html>
