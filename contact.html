<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Essie Anawalt</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <script src="js/main.js" defer></script>
    <script src="js/contact.js" defer></script>
  </head>
  <body>
    <header></header>

    <div class="page-layout">
      <main>
        <h1>Contact</h1>

        <div class="split-layout">
          <img
            class="validation-img"
            src="img/bear-validation.jpg"
            alt="an drawing of a bear complaining"
          />

          <!-- form -->
          <form id="contact-form">
            <p class="stacked">
              <label for="full-name">Full Name</label>
              <input type="text" id="full-name" name="full_name" />
              <span class="field-error" id="full-name-error"></span>
            </p>
            <p class="stacked">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" />
              <span class="field-error" id="email-error"></span>
            </p>
            <p class="stacked">
              <label for="message">Message</label>
              <textarea id="message" name="message"></textarea>
              <span class="field-error" id="message-error"></span>
            </p>
            <p class="stacked">
              <label for="validation">What is the image to the left?</label>
              <input type="text" id="validation" name="validation" />
              <span class="field-error" id="validation-error"></span>
            </p>
            <p>
              <input type="checkbox" id="business" name="business" />
              <label for="business">This is a business-related inquery</label>
            </p>
            <p>
              <button id="btn-submit" class="btn">Submit</button>
            </p>
          </form>

          <!-- Display confirmation -->
          <div id="success-message"></div>

          <!-- Display error -->
          <div id="error-message"></div>
        </div>
      </main>

      <aside></aside>
    </div>

    <footer></footer>
  </body>
</html>
